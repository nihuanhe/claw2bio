# Claw2Bio — claw2bio.site (VitePress static site)
# English root + /zh/ Chinese, cleanUrls: true (/foo -> foo.html)
# Live version as deployed on 119.91.105.37 (2026-09-17), SSL blocks managed by Certbot
# (Let's Encrypt, auto-renew, cert paths /etc/letsencrypt/live/claw2bio.site/)

server {
    if ($host = www.claw2bio.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = claw2bio.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name claw2bio.site www.claw2bio.site 119.91.105.37 _;

    root /var/www/claw2bio;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # VitePress cleanUrls
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # hashed assets: cache hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}

# Default HTTPS: reject TLS for unknown hosts (raw IP access) — no cert, no warning page
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTPS — Let's Encrypt cert issued 2026-09-17, expires 2026-12-16, auto-renews
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name claw2bio.site www.claw2bio.site;

    root /var/www/claw2bio;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/claw2bio.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/claw2bio.site/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
